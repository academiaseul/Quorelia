<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Eagle Eye — social card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Tarjeta de anuncio de Eagle Eye para LinkedIn (1200×630) y X (1600×900).
     Mismo sistema que promo-ancho: navy, halo teal, mono. Se captura con
     Chrome headless — ver el comando al pie del archivo. ?x en la URL
     activa la variante 1600×900. */
  :root{
    --navy:#081522; --navy-2:#0e2233;
    --line:rgba(255,255,255,.14); --line-2:rgba(255,255,255,.07);
    --txt:#f2f5f7; --dim:#8fa3b0; --dim-2:#5b6d7a;
    --teal:#1fb6a8; --teal-d:#149487; --ink:#0a0f14;
    --sans:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    --mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;}
  body{font-family:var(--sans);background:var(--navy);color:var(--txt);
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  .card{width:100vw;height:100vh;position:relative;overflow:hidden;
    background:
      radial-gradient(90% 70% at 50% 46%, rgba(31,182,168,.13), transparent 62%),
      linear-gradient(160deg,#081522,#0c1e2e 58%,#081522);}
  .inner{width:1200px;height:630px;padding:46px 64px 40px;margin:0 auto;
    display:flex;flex-direction:column;}
  body.x .inner{zoom:1.333;height:675px;padding-top:60px;padding-bottom:52px;}

  .top{display:flex;align-items:center;justify-content:space-between;}
  .marca{display:flex;align-items:center;gap:13px;}
  .marca img.mk{height:30px;width:auto;display:block;}
  .marca img.wm{height:15px;width:auto;display:block;}
  .kick{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--dim);}
  .kick b{color:var(--teal);font-weight:500;}

  .diagram{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:0;padding-top:30px;}
  .tier{display:flex;gap:12px;}
  .chip{font-family:var(--mono);font-size:12px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--dim);border:1px solid var(--line);
    padding:11px 18px;background:rgba(255,255,255,.02);}
  .tier.out .chip{color:#dbe6ec;border-color:rgba(31,182,168,.42);}
  .link{width:1px;height:30px;background:linear-gradient(180deg,var(--line),rgba(31,182,168,.6));}
  .link.dn{background:linear-gradient(180deg,rgba(31,182,168,.6),var(--line));}
  .core{display:inline-flex;align-items:center;gap:16px;background:var(--ink);
    color:#fff;font-family:var(--mono);font-size:23px;letter-spacing:.34em;
    text-transform:uppercase;padding:21px 46px 21px 40px;margin:0;
    clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
    box-shadow:0 0 60px rgba(31,182,168,.28), 0 0 18px rgba(31,182,168,.20);}
  .core .dot{width:9px;height:9px;background:var(--teal);border-radius:50%;flex:none;
    box-shadow:0 0 12px rgba(31,182,168,.9);}

  .tagline{text-align:center;font-family:var(--mono);font-size:15.5px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-top:34px;}
  .tagline span{color:var(--dim-2);padding:0 10px;}

  .bot{display:flex;align-items:baseline;justify-content:space-between;
    border-top:1px solid var(--line-2);padding-top:18px;margin-top:38px;}
  .url{font-family:var(--mono);font-size:14px;letter-spacing:.12em;color:#fff;}
  .motto{font-size:12.5px;color:var(--dim);letter-spacing:.01em;}
</style></head>
<body>
<div class="card"><div class="inner">
  <div class="top">
    <span class="marca">
      <img class="mk" src="quorelia-mark-white.png" alt="">
      <img class="wm" src="quorelia-wordmark-white.png" alt="Quorelia">
    </span>
    <span class="kick"><b>Solar · Wind · BESS</b>&nbsp;&nbsp;·&nbsp;&nbsp;Operational intelligence</span>
  </div>

  <div class="diagram">
    <div class="tier">
      <span class="chip">SCADA</span>
      <span class="chip">BESS</span>
      <span class="chip">Inverters</span>
      <span class="chip">Weather</span>
      <span class="chip">Maintenance</span>
    </div>
    <div class="link"></div>
    <span class="core"><span class="dot"></span>Eagle&nbsp;Eye</span>
    <div class="link dn"></div>
    <div class="tier out">
      <span class="chip">Insight</span>
      <span class="chip">Risk</span>
      <span class="chip">Action</span>
      <span class="chip">Optimization</span>
    </div>
    <p class="tagline">See more <span>·</span> Know earlier <span>·</span> Operate better</p>
  </div>

  <div class="bot">
    <span class="url">quorelia.org</span>
    <span class="motto">Ever watching. In service of the planet's energy.</span>
  </div>
</div></div>
<script>if(location.search.indexOf('x')>=0)document.body.classList.add('x');</script>

Captura:

    --window-size=1600,900 --screenshot=eagle-eye-x.png         eagle-eye-post.html?x
-->
</body></html>
